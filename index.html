<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MUÑIZ Pedidos</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#F2F2F7">

  <!-- iOS home-screen app. status-bar-style=default keeps app content BELOW the clock/battery -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pedidos">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" href="./icon-192.png">

  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./pedidos-ui.css">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
  <style>
    html,body{margin:0;background:#F2F2F7;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;}
    /* keep app text at a fixed scale even if the phone has large-text accessibility on */
    html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
    *{-webkit-user-select:none;user-select:none;}
    input,textarea,pre{-webkit-user-select:text;user-select:text;}
    /* never let a fixed bottom bar hide under the iPhone home indicator */
    .safe-bottom{padding-bottom:env(safe-area-inset-bottom,0px);}
    #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#F2F2F7;color:#1C1C1E;font-family:-apple-system,system-ui,sans-serif;z-index:99;transition:opacity .35s ease,transform .45s cubic-bezier(.16,1,.3,1)}
    #boot.out{opacity:0;transform:scale(1.04)}
    #boot .bm{width:76px;height:76px;border-radius:20px;background:linear-gradient(145deg,#FF7A2E,#FF5A00);color:#fff;display:flex;align-items:center;justify-content:center;font:800 40px/1 -apple-system,system-ui,sans-serif;box-shadow:0 14px 30px -12px rgba(255,90,0,.6);animation:bpop .7s cubic-bezier(.34,1.56,.64,1) both}
    #boot .bt{margin-top:16px;font:800 22px/1 -apple-system,system-ui,sans-serif;letter-spacing:-.02em;animation:bfade .6s .15s both}
    #boot .bs{margin-top:6px;font:500 13px/1 -apple-system,system-ui,sans-serif;color:#8E8E93;animation:bfade .6s .25s both}
    #boot .sp{margin-top:22px;width:22px;height:22px;border-radius:50%;border:2.5px solid rgba(60,60,67,.15);border-top-color:#FF5A00;animation:bspin .8s linear infinite}
    @keyframes bpop{from{opacity:0;transform:scale(.6)}}@keyframes bfade{from{opacity:0;transform:translateY(6px)}}@keyframes bspin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="boot">
    <div class="bm">M</div>
    <div class="bt">Muñiz Pedidos</div>
    <div class="bs">Cargando pedidos…</div>
    <div class="sp"></div>
  </div>
  <script>
    (function(){var n=0,t=setInterval(function(){var r=document.getElementById('root');
      if((r&&r.childElementCount>0)||++n>60){var b=document.getElementById('boot');if(b){b.classList.add('out');setTimeout(function(){b.remove()},420)}clearInterval(t);}},50);})();
  </script>
  <script src="./updater.js"></script>
  <script src="./config.js"></script>
  <script src="./pedidos_db.js"></script>
  <!-- combustible: mismo documento, mismo estilo. fuel.js solo expone window.MunizFuel aquí (no dibuja nada hasta que pedidos_menu.js lo abre) -->
  <script src="./fuel.js"></script>
  <script src="./pedidos_menu.js"></script>
  <script src="./app.js"></script>
  <script src="./pedidos-motion.js"></script>
</body>
</html>
