<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- v253: viewport-fit=cover = iOS gives env(safe-area-inset-*) its real size (without it: 0, and the bottom bars ran under
       the home indicator). With status-bar-style default the page still starts below the clock. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MUÑIZ Pedidos</title>
  <meta name="description" content="Pedidos de material y PO de combustible · Muñiz Concrete & Contracting">
  <meta property="og:site_name" content="Muñiz Pedidos">
  <meta property="og:title" content="Muñiz Pedidos · toca para abrir">
  <meta property="og:description" content="Pedidos de material y combustible · Muñiz Concrete & Contracting">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://muniz-2026.github.io/muniz-pedidos/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#F2F2F7">

  <!-- iOS home-screen app. status-bar-style=default keeps app content BELOW the clock/battery -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pedidos">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" href="./icon-192.png">

  <link rel="preconnect" href="https://kchnylxocdniacpfugyf.supabase.co" crossorigin>
  <link rel="preload" as="fetch" href="./catalog_ace.json" crossorigin>
  <link rel="preload" as="fetch" href="./catalog_cmc.json" crossorigin>
  <link rel="preload" as="fetch" href="./catalog_rss.json" crossorigin>
  <link rel="preload" as="fetch" href="./catalog_whitecap.json" crossorigin>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./pedidos-ui.css">
  <style>
    html,body{margin:0;background:#F2F2F7;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;}
    /* stops iOS from inflating text on rotation; it does not block the person's own zoom */
    html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
    *{-webkit-user-select:none;user-select:none;}
    input,textarea,pre{-webkit-user-select:text;user-select:text;}
    /* never let a fixed bottom bar hide under the iPhone home indicator: it ends 12 px above it (12 + safe area, like the fuel
       steps' bar). v253 (Tito, Nov 10: the green PEDIR PARA button ran off the bottom): env() was 0 until viewport-fit=cover */
    .safe-bottom{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));}
    /* the catalog's store-colored VER MI PEDIDO bar has no background: its button reaches the bottom edge, its label stays above */
    .safe-bottom:not(.bg-white){padding:0;}
    .safe-bottom:not(.bg-white)>button{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));}
    /* the pages under those bars (cart pb-40, supervisor review pb-56, catalog pb-28) keep their end clear of the bar: each
       reserve grows by what its bar grew */
    #root .min-h-screen.pb-40{padding-bottom:calc(10rem + 12px + env(safe-area-inset-bottom,0px));}
    #root .min-h-screen.pb-56{padding-bottom:calc(14rem + 12px + env(safe-area-inset-bottom,0px));}
    #root .min-h-screen.pb-28{padding-bottom:calc(7rem + env(safe-area-inset-bottom,0px));}
    /* landscape: the page reaches under the notch now; it keeps to the safe area sideways, as iOS's own side margins did */
    body{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);}
    #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#F2F2F7;color:#1C1C1E;font-family:-apple-system,system-ui,sans-serif;z-index:99;transition:opacity .35s ease,transform .45s cubic-bezier(.16,1,.3,1)}
    #boot.out{opacity:0;transform:scale(1.04);pointer-events:none}
    #boot .bm{width:76px;height:76px;border-radius:18px;display:block;box-shadow:0 10px 24px -12px rgba(0,0,0,.35)}
    #boot .rt{margin-top:18px;min-height:48px;padding:0 22px;border:0;border-radius:12px;background:#1C1C1E;color:#fff;font:800 17px/1 -apple-system,system-ui,sans-serif}
    #boot .rt:active{transform:scale(.97)}
    #boot .bt{margin-top:16px;font:800 22px/1 -apple-system,system-ui,sans-serif;letter-spacing:-.02em}
    @media (prefers-reduced-motion:no-preference){#boot .bm{animation:bpop .7s cubic-bezier(.34,1.56,.64,1) both}#boot .bt{animation:bfade .6s .15s both}#boot .bs{animation:bfade .6s .25s both}}
    #boot .bs{margin-top:6px;padding:0 24px;text-align:center;font:600 15px/1.3 -apple-system,system-ui,sans-serif;color:#636366}
    #boot .sp{margin-top:22px;width:22px;height:22px;border-radius:50%;border:2.5px solid rgba(60,60,67,.15);border-top-color:#FF5A00;animation:bspin .8s linear infinite}
    @keyframes bpop{from{opacity:0;transform:scale(.6)}}@keyframes bfade{from{opacity:0;transform:translateY(6px)}}@keyframes bspin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="boot">
    <img class="bm" src="./apple-touch-icon.png" alt="">
    <div class="bt">Muñiz Pedidos</div>
    <div class="bs">Cargando pedidos…</div>
    <div class="sp"></div>
  </div>
  <script>
    /* v247: the loading screen stays until the app has drawn (it used to leave after 15 s and show a blank page on weak
       signal): at 15 s it says the signal is slow, at 45 s (or 5 s after a script error) it offers REINTENTAR */
    (function(){var n=0,err=0;window.addEventListener('error',function(){err=1});var t=setInterval(function(){var r=document.getElementById('root'),b=document.getElementById('boot');
      if(r&&r.childElementCount>0){if(b){b.classList.add('out');setTimeout(function(){b.remove()},420)}clearInterval(t);return}
      n++;var s=b&&b.querySelector('.bs');
      if(s&&(n===300||(err&&n===60)))s.textContent=err?'Algo fall\u00f3 al abrir.':'La se\u00f1al est\u00e1 lenta \u2014 sigue cargando\u2026';
      if(b&&(n===900||(err&&n===100))&&!b.querySelector('.rt')){var k=document.createElement('button');k.className='rt';k.type='button';k.textContent='REINTENTAR';k.onclick=function(){location.reload()};b.appendChild(k)}},50);})();
  </script>
  <script src="./updater.js"></script>
  <script src="./config.js"></script>
  <!-- links que llegan cortados: busca el pedido completo en el servidor (antes de app.js) -->
  <script src="./link_rescue.js"></script>
  <script src="./pedidos_db.js"></script>
  <!-- actividad en vivo (Command Center · ACTIVITY): pantallas, toques, carrito, pasos del combustible. Antes de app.js -->
  <script src="./mz_track.js" data-page="pedidos"></script>
  <!-- combustible: mismo documento, mismo estilo. fuel.js solo expone window.MunizFuel aquí (no dibuja nada hasta que pedidos_menu.js lo abre) -->
  <script src="./fuel.js"></script>
  <script src="./pedidos_menu.js"></script>
  <script src="./app.js"></script>
  <script src="./pedidos-motion.js"></script>
</body>
</html>
