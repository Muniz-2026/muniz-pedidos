<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MUÑIZ Pedidos</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#17181A">

  <!-- iOS home-screen app. status-bar-style=default keeps app content BELOW the clock/battery -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pedidos">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" href="./icon-192.png">

  <link rel="stylesheet" href="./styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
  <style>
    html,body{margin:0;background:#EDEBE6;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;}
    /* keep app text at a fixed scale even if the phone has large-text accessibility on */
    html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
    *{-webkit-user-select:none;user-select:none;}
    input,textarea,pre{-webkit-user-select:text;user-select:text;}
    /* never let a fixed bottom bar hide under the iPhone home indicator */
    .safe-bottom{padding-bottom:env(safe-area-inset-bottom,0px);}
    #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#17181A;color:#EDEBE6;font-family:'Archivo Black',system-ui,sans-serif;z-index:99;}
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="boot">
    <div style="font-size:40px">MUÑIZ<span style="color:#FF5A00">.</span></div>
    <div style="font-size:13px;opacity:.6;margin-top:6px;font-family:system-ui">Cargando pedidos…</div>
  </div>
  <script>
    (function(){var n=0,t=setInterval(function(){var r=document.getElementById('root');
      if((r&&r.childElementCount>0)||++n>60){var b=document.getElementById('boot');if(b)b.remove();clearInterval(t);}},50);})();
  </script>
  <script src="./app.js"></script>
</body>
</html>
