<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0B0F14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Muñiz Bandeja</title>
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="stylesheet" href="./bandeja.css">
</head>
<body>
<div id="root"></div>
<script src="./config.js"></script>
<script>/* v207 · cuenta cada vez que se abre MIS PEDIDOS (el botón de la cabecera, la pastilla y el aviso llegan
   todos a bandeja.html#mis). Solo deja un registro; no cambia nada en la pantalla. */
(function(){try{var S=(window.MUNIZ_CONFIG||{}).SUPABASE||{},U=String(S.URL||"").trim().replace(/\/+$/,""),K=String(S.ANON_KEY||"").trim();if(!U||!K)return;
var last=0,log=function(){if(location.hash!=="#mis"||Date.now()-last<5e3)return;last=Date.now();var d=null,w=null,f="";
try{d=localStorage.getItem("muniz_device_id")||null;var p=JSON.parse(localStorage.getItem("muniz_pedido")||"null");w=p&&p.name?String(p.name).toUpperCase():null}catch(e){}
try{f=document.referrer?(new URL(document.referrer).pathname.split("/").pop()||"index.html"):""}catch(e){}
var sa=!!(navigator.standalone===true||(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches));
fetch(U+"/rest/v1/events",{method:"POST",keepalive:true,headers:{apikey:K,Authorization:"Bearer "+K,"Content-Type":"application/json"},body:JSON.stringify({device_id:d,app:"pedidos",event:"mis_open",who:w,meta:{from:f,sa:sa}})}).catch(function(){})};
log();window.addEventListener("hashchange",log)}catch(e){}})();</script>
<script src="./mz_track.js" data-page="bandeja"></script>
<script src="./bandeja.js"></script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(function(){});}</script>
</body>
</html>
